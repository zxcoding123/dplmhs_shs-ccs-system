<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" fill="#061E4E" rx="8"/>

  <!-- Graduation Cap -->
  <g transform="translate(32, 18)">
    <!-- Cap top -->
    <path d="M -16 -2 L 0 -8 L 16 -2 Z" fill="#c2a74d" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Cap board -->
    <rect x="-18" y="-2" width="36" height="4" fill="#c2a74d" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Tassel -->
    <line x1="0" y1="2" x2="0" y2="12" stroke="#e92b2d" stroke-width="2"/>
    <circle cx="0" cy="14" r="2" fill="#e92b2d"/>
  </g>

  <!-- Computer Monitor -->
  <g transform="translate(32, 38)">
    <!-- Monitor screen -->
    <rect x="-12" y="-10" width="24" height="16" fill="#ffffff" stroke="#c2a74d" stroke-width="1.5" rx="1"/>
    <!-- Screen content - code brackets -->
    <text x="-8" y="-2" font-family="monospace" font-size="6" fill="#061E4E" font-weight="bold">&lt;</text>
    <text x="2" y="-2" font-family="monospace" font-size="6" fill="#061E4E" font-weight="bold">/&gt;</text>
    <!-- Monitor stand -->
    <rect x="-2" y="6" width="4" height="3" fill="#c2a74d"/>
    <!-- Stand base -->
    <rect x="-8" y="9" width="16" height="2" fill="#c2a74d" rx="1"/>
  </g>

  <!-- Accent circle around -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#c2a74d" stroke-width="1.5" opacity="0.6"/>
</svg>